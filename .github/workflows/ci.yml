name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
